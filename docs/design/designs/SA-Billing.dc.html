<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Super Admin – Plans &amp; Billing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F12}
a{color:#C6FF3D}a:hover{color:#E2FF9A}
button{font:inherit}
.num{font-family:'Space Grotesk','Hind Siliguri',sans-serif;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; display: flex; background: {{t.bg}}; color: {{t.text}}; font-family: 'Hind Siliguri', 'Space Grotesk', system-ui, sans-serif; overflow: hidden">
<dc-import name="SASidebar" active="billing" dark="{{dark}}" hint-size="248px,1000px"></dc-import>
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 28px 32px; box-sizing: border-box; min-width: 0">

<header style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 26px">প্ল্যান ও বিলিং</h1>
<span style="font-size: 14px; color: {{t.muted}}">দাম এখনো ঠিক হয়নি, তাই [দাম] রাখা হয়েছে</span>
</div>
<button style="height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font-size: 14px">+ নতুন প্ল্যান</button>
</header>

<section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{plans}}" as="p" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 16px; background: {{t.surface}}; {{p.border}}">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 18px; font-weight: 700">{{p.name}}</span>
<span class="num" style="font-size: 13px; color: {{t.muted}}">{{p.gyms}} জিম</span>
</div>
<div style="display: flex; align-items: baseline; gap: 6px"><span class="num" style="font-size: 30px; font-weight: 700">[দাম]</span><span style="font-size: 14px; color: {{t.muted}}">/ মাস</span></div>
<span style="font-size: 14px; color: {{t.muted}}">{{p.limit}}</span>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{p.features}}" as="f" hint-placeholder-count="4">
<span style="display: flex; align-items: center; gap: 8px; font-size: 14px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>{{f}}</span>
</sc-for>
</div>
<button style="margin-top: auto; height: 42px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.text}}; font-size: 14px; cursor: pointer">প্ল্যান এডিট করুন</button>
</div>
</sc-for>
</section>

<section style="display: flex; flex-direction: column; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.border}}; overflow: hidden; flex-grow: 1">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 20px">
<h2 style="margin: 0; font-size: 17px">ইনভয়েস · সেপ্টেম্বর</h2>
<div style="display: flex; gap: 16px; font-size: 14px">
<span style="color: {{t.muted}}">পরিশোধিত <span class="num" style="color: {{t.success}}; font-weight: 600">29</span></span>
<span style="color: {{t.muted}}">বকেয়া <span class="num" style="color: {{t.warning}}; font-weight: 600">4</span></span>
</div>
</div>
<div style="display: grid; grid-template-columns: 1.3fr 2fr 1fr 1fr 1.2fr 1fr 1.2fr 200px; gap: 12px; padding: 10px 20px; font-size: 13px; color: {{t.muted}}; background: {{t.chip}}">
<span>ইনভয়েস</span><span>জিম</span><span>প্ল্যান</span><span>পরিমাণ</span><span>শেষ তারিখ</span><span>মাধ্যম</span><span>স্ট্যাটাস</span><span style="text-align: right">অ্যাকশন</span>
</div>
<sc-for list="{{invoices}}" as="i" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 1.3fr 2fr 1fr 1fr 1.2fr 1fr 1.2fr 200px; gap: 12px; align-items: center; padding: 11px 20px; border-top: 1px solid {{t.border}}; font-size: 14px">
<span class="num" style="color: {{t.muted}}">{{i.inv}}</span><span style="font-weight: 600">{{i.gym}}</span><span>{{i.plan}}</span><span class="num">[দাম]</span><span class="num">{{i.due}}</span><span>{{i.method}}</span>
<span><span style="font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; {{i.badge}}">{{i.status}}</span></span>
<span style="display: flex; justify-content: flex-end; gap: 6px">
<sc-if value="{{i.overdue}}" hint-placeholder-val="{{false}}">
<button style="height: 34px; padding: 0 10px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.text}}; font-size: 13px; cursor: pointer">রিমাইন্ডার</button>
<button style="height: 34px; padding: 0 10px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.danger}}; font-size: 13px; cursor: pointer">স্থগিত</button>
</sc-if>
<sc-if value="{{i.paid}}" hint-placeholder-val="{{true}}">
<button style="height: 34px; padding: 0 10px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.text}}; font-size: 13px; cursor: pointer">রিসিট</button>
</sc-if>
</span>
</div>
</sc-for>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"accent":{"editor":"color","default":"#C6FF3D","options":["#C6FF3D","#FF6B2C","#38BDF8"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? true;
    var accent = this.props.accent ?? '#C6FF3D';
    var t = dark ? { bg: '#0E0F12', surface: '#1A1C21', border: '#2A2D34', chip: '#23262D', text: '#F4F4F5', muted: '#A1A7B0', success: '#4ADE80', warning: '#FBBF24', danger: '#F87171' }
                 : { bg: '#F4F5F1', surface: '#FFFFFF', border: '#E2E4DE', chip: '#EEF0EA', text: '#111214', muted: '#555B64', success: '#15803D', warning: '#B45309', danger: '#B91C1C' };
    function badge(k) {
      var m = dark ? { amber: 'background: rgba(251,191,36,0.14); color: #FBBF24', green: 'background: rgba(74,222,128,0.14); color: #4ADE80' }
                   : { amber: 'background: #FEF3C7; color: #92400E', green: 'background: #DCFCE7; color: #166534' };
      return m[k];
    }
    var plans = [
      { name: 'স্টার্টার', gyms: '21', limit: '১৫০ মেম্বার পর্যন্ত · ১ শাখা', features: ['মেম্বার ও পেমেন্ট', 'SMS রিমাইন্ডার', 'বেসিক রিপোর্ট', '১টি মেশিন'], border: 'border: 1px solid ' + t.border },
      { name: 'গ্রোথ', gyms: '14', limit: '৫০০ মেম্বার পর্যন্ত · ২ শাখা', features: ['স্টার্টারের সব', 'হোয়াটসঅ্যাপ অটোমেশন', 'মেম্বার ও ট্রেইনার অ্যাপ', 'ফ্রি ওয়েবসাইট'], border: 'border: 2px solid ' + accent },
      { name: 'প্রো', gyms: '4', limit: 'আনলিমিটেড মেম্বার ও শাখা', features: ['গ্রোথের সব', 'নিজস্ব ব্র্যান্ডের অ্যাপ', 'এআই ডায়েট ট্র্যাকিং', 'অগ্রাধিকার সাপোর্ট'], border: 'border: 1px solid ' + t.border }
    ];
    var raw = [
      ['SUB-0931', 'মাসল ফ্যাক্টরি', 'স্টার্টার', '15 Sep', '—', 0],
      ['SUB-0928', 'এক্সট্রিম ফিট', 'স্টার্টার', '01 Sep', '—', 0],
      ['SUB-0925', 'পাওয়ার হাউস জিম', 'গ্রোথ', '10 Sep', 'বিকাশ', 1],
      ['SUB-0922', 'গোল্ডেন জিম', 'প্রো', '05 Sep', 'ব্যাংক', 1],
      ['SUB-0919', 'ফিট জোন', 'গ্রোথ', '03 Sep', 'নগদ', 1]
    ];
    var invoices = raw.map(function (r) { return { inv: r[0], gym: r[1], plan: r[2], due: r[3], method: r[4], overdue: !r[5], paid: !!r[5], status: r[5] ? 'পরিশোধিত' : 'বকেয়া', badge: badge(r[5] ? 'green' : 'amber') }; });
    return { t: t, dark: dark, accent: accent, plans: plans, invoices: invoices };
  }
}
</script>
</body>
</html>
