<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Members – Desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F12}
a{color:#C6FF3D}a:hover{color:#E2FF9A}
button,input,select{font:inherit}
.num{font-family:'Space Grotesk','Hind Siliguri',sans-serif;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; display: flex; background: {{t.bg}}; color: {{t.text}}; font-family: 'Hind Siliguri', 'Space Grotesk', system-ui, sans-serif; overflow: hidden">
<dc-import name="Sidebar" active="members" dark="{{dark}}" hint-size="248px,1000px"></dc-import>
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 28px 32px; box-sizing: border-box; min-width: 0">

<header style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: baseline; gap: 12px">
<h1 style="margin: 0; font-size: 26px">মেম্বার</h1>
<span class="num" style="font-size: 15px; color: {{t.muted}}">মোট 348 · সক্রিয় 312</span>
</div>
<div style="display: flex; gap: 10px">
<button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>
Excel এক্সপোর্ট</button>
<button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.text}}; font-size: 14px; cursor: pointer">QR ভর্তি লিংক</button>
<button style="height: 44px; padding: 0 18px; border-radius: 12px; border: none; background: {{accent}}; color: #0E0F12; font-weight: 600; font-size: 14px; cursor: pointer">+ নতুন মেম্বার</button>
</div>
</header>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; gap: 6px; padding: 4px; border-radius: 12px; background: {{t.surface}}; border: 1px solid {{t.border}}">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
<button style="height: 38px; padding: 0 14px; border-radius: 9px; border: none; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; {{tb.style}}">{{tb.label}} <span class="num" style="font-size: 12px; opacity: 0.8">{{tb.count}}</span></button>
</sc-for>
</div>
<div style="display: flex; gap: 10px">
<label style="display: flex; align-items: center; gap: 8px; width: 280px; height: 44px; padding: 0 14px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.muted}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input aria-label="মেম্বার খুঁজুন" placeholder="নাম, ফোন বা আইডি" style="flex-grow: 1; border: none; outline: none; background: transparent; color: {{t.text}}; font-size: 14px">
</label>
<label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; font-size: 14px; color: {{t.muted}}">প্যাকেজ
<select style="border: none; background: transparent; color: {{t.text}}; font-size: 14px"><option>সব</option><option>মাসিক</option><option>৩ মাস</option><option>৬ মাস</option></select>
</label>
</div>
</div>

<section style="display: flex; flex-direction: column; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.border}}; overflow: hidden; flex-grow: 1">
<div style="display: grid; grid-template-columns: 40px 2.4fr 1fr 1.3fr 1.2fr 1.1fr 1fr 1fr 110px; gap: 12px; align-items: center; padding: 12px 20px; font-size: 13px; color: {{t.muted}}; background: {{t.chip}}">
<input type="checkbox" aria-label="সব সিলেক্ট করুন" style="width: 18px; height: 18px">
<span>মেম্বার</span><span>আইডি</span><span>প্যাকেজ</span><span>মেয়াদ শেষ</span><span>স্ট্যাটাস</span><span>বকেয়া</span><span>বায়োমেট্রিক</span><span style="text-align: right">অ্যাকশন</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
<div style="display: grid; grid-template-columns: 40px 2.4fr 1fr 1.3fr 1.2fr 1.1fr 1fr 1fr 110px; gap: 12px; align-items: center; padding: 10px 20px; border-top: 1px solid {{t.border}}; font-size: 14px">
<input type="checkbox" aria-label="সিলেক্ট" style="width: 18px; height: 18px">
<a href="MemberProfile.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: {{t.text}}">
<span style="width: 36px; height: 36px; border-radius: 18px; background: {{t.chip}}; display: flex; align-items: center; justify-content: center; font-weight: 700">{{r.initial}}</span>
<span style="display: flex; flex-direction: column"><span style="font-weight: 600">{{r.name}}</span><span class="num" style="font-size: 12px; color: {{t.muted}}">{{r.phone}}</span></span>
</a>
<span class="num" style="color: {{t.muted}}">{{r.id}}</span>
<span>{{r.pkg}}</span>
<span class="num">{{r.exp}}</span>
<span><span style="font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; {{r.badge}}">{{r.status}}</span></span>
<span class="num" style="{{r.dueStyle}}">{{r.due}}</span>
<span style="font-size: 13px; color: {{t.muted}}">{{r.bio}}</span>
<span style="display: flex; justify-content: flex-end; gap: 6px">
<button aria-label="পেমেন্ট নিন" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h20v14H2zM2 10h20"></path></svg></button>
<button aria-label="হোয়াটসঅ্যাপ" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.success}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"></path></svg></button>
</span>
</div>
</sc-for>
<div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-top: 1px solid {{t.border}}; font-size: 14px; color: {{t.muted}}">
<span class="num">1–9 of 348</span>
<div style="display: flex; gap: 6px">
<button style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.text}}; cursor: pointer">আগের</button>
<button class="num" style="width: 36px; height: 36px; border-radius: 10px; border: none; background: {{accent}}; color: #0E0F12; font-weight: 600">1</button>
<button class="num" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.text}}">2</button>
<button class="num" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.text}}">3</button>
<button style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.text}}; cursor: pointer">পরের</button>
</div>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"accent":{"editor":"color","default":"#C6FF3D","options":["#C6FF3D","#FF6B2C","#38BDF8"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? true;
    var accent = this.props.accent ?? '#C6FF3D';
    var t = dark ? { bg: '#0E0F12', surface: '#1A1C21', border: '#2A2D34', chip: '#23262D', text: '#F4F4F5', muted: '#A1A7B0', success: '#4ADE80', warning: '#FBBF24' }
                 : { bg: '#F4F5F1', surface: '#FFFFFF', border: '#E2E4DE', chip: '#EEF0EA', text: '#111214', muted: '#555B64', success: '#15803D', warning: '#B45309' };
    function badge(k) {
      var m = dark ? { red: 'background: rgba(248,113,113,0.14); color: #F87171', amber: 'background: rgba(251,191,36,0.14); color: #FBBF24', green: 'background: rgba(74,222,128,0.14); color: #4ADE80', gray: 'background: rgba(161,167,176,0.16); color: #C3C8CF' }
                   : { red: 'background: #FEE2E2; color: #991B1B', amber: 'background: #FEF3C7; color: #92400E', green: 'background: #DCFCE7; color: #166534', gray: 'background: #E5E7EB; color: #374151' };
      return m[k];
    }
    var tabNames = [['সব', '348', true], ['সক্রিয়', '312'], ['বকেয়া', '12'], ['মেয়াদ শেষ', '24'], ['ফ্রিজ', '12']];
    var tabs = tabNames.map(function (x) { return { label: x[0], count: x[1], style: x[2] ? 'background: ' + accent + '; color: #0E0F12; font-weight: 600' : 'background: transparent; color: ' + t.muted }; });
    var S = { active: ['সক্রিয়', 'green'], due: ['বকেয়া', 'amber'], expired: ['মেয়াদ শেষ', 'red'], frozen: ['ফ্রিজ', 'gray'] };
    var data = [
      ['র', 'রাফি আহমেদ', '017•• •••421', 'PH-0142', 'মাসিক', '24 Sep 2026', 'due', '৳1,500', 'ফেস + আঙুল'],
      ['ত', 'তানিয়া ইসলাম', '018•• •••907', 'PH-0131', '৩ মাস', '26 Sep 2026', 'active', '৳0', 'ফেস'],
      ['স', 'সাকিব হাসান', '019•• •••118', 'PH-0098', 'মাসিক', '29 Sep 2026', 'due', '৳800', 'আঙুল'],
      ['ন', 'নুসরাত জাহান', '016•• •••352', 'PH-0077', '৬ মাস', '30 Sep 2026', 'active', '৳0', 'ফেস'],
      ['ই', 'ইমরান হোসেন', '017•• •••664', 'PH-0065', 'মাসিক', '18 Sep 2026', 'expired', '৳1,500', 'আঙুল'],
      ['ন', 'নাদিয়া করিম', '015•• •••230', 'PH-0159', '৩ মাস', '12 Nov 2026', 'active', '৳0', 'ফেস + আঙুল'],
      ['ফ', 'ফাহিম রহমান', '018•• •••781', 'PH-0161', 'মাসিক', '20 Oct 2026', 'active', '৳0', 'ফেস'],
      ['ম', 'মারিয়া সুলতানা', '019•• •••045', 'PH-0120', '৬ মাস', '—', 'frozen', '৳0', 'RFID কার্ড'],
      ['আ', 'আসিফ ইকবাল', '017•• •••893', 'PH-0103', 'মাসিক', '15 Oct 2026', 'active', '৳0', 'ফেস']
    ];
    var rows = data.map(function (d) {
      var s = S[d[6]];
      return { initial: d[0], name: d[1], phone: d[2], id: d[3], pkg: d[4], exp: d[5], status: s[0], badge: badge(s[1]), due: d[7], dueStyle: d[7] === '৳0' ? 'color: ' + t.muted : 'color: ' + t.warning + '; font-weight: 600', bio: d[8] };
    });
    return { t: t, dark: dark, accent: accent, tabs: tabs, rows: rows };
  }
}
</script>
</body>
</html>
