<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Super Admin – Gyms</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F12}
a{color:#C6FF3D}a:hover{color:#E2FF9A}
button,input,select{font:inherit}
.num{font-family:'Space Grotesk','Hind Siliguri',sans-serif;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; display: flex; background: {{t.bg}}; color: {{t.text}}; font-family: 'Hind Siliguri', 'Space Grotesk', system-ui, sans-serif; overflow: hidden">
<dc-import name="SASidebar" active="gyms" dark="{{dark}}" hint-size="248px,1000px"></dc-import>
<main style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 28px 32px; box-sizing: border-box; min-width: 0">

<header style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: baseline; gap: 12px">
<h1 style="margin: 0; font-size: 26px">জিম</h1>
<span class="num" style="font-size: 15px; color: {{t.muted}}">মোট 48</span>
</div>
<button style="height: 44px; padding: 0 18px; border-radius: 12px; border: none; background: {{accent}}; color: #0E0F12; font-weight: 600; font-size: 14px">+ নতুন জিম যোগ করুন</button>
</header>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; gap: 6px; padding: 4px; border-radius: 12px; background: {{t.surface}}; border: 1px solid {{t.border}}">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
<button style="height: 38px; padding: 0 14px; border-radius: 9px; border: none; font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; {{tb.style}}">{{tb.label}} <span class="num" style="font-size: 12px; opacity: 0.8">{{tb.count}}</span></button>
</sc-for>
</div>
<div style="display: flex; gap: 10px">
<label style="display: flex; align-items: center; gap: 8px; width: 280px; height: 44px; padding: 0 14px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.muted}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input aria-label="জিম খুঁজুন" placeholder="জিমের নাম, মালিক বা ফোন" style="flex-grow: 1; border: none; outline: none; background: transparent; color: {{t.text}}; font-size: 14px"></input>
</label>
<label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid {{t.border}}; background: {{t.surface}}; font-size: 14px; color: {{t.muted}}">শহর
<select style="border: none; background: transparent; color: {{t.text}}; font-size: 14px"><option>সব</option><option>ঢাকা</option><option>চট্টগ্রাম</option><option>সিলেট</option></select>
</label>
</div>
</div>

<section style="display: flex; flex-direction: column; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.border}}; overflow: hidden; flex-grow: 1">
<div style="display: grid; grid-template-columns: 2.3fr 1.1fr 1fr 0.9fr 1.1fr 1.2fr 1fr 1.3fr 120px; gap: 12px; padding: 12px 20px; font-size: 13px; color: {{t.muted}}; background: {{t.chip}}">
<span>জিম ও মালিক</span><span>শহর</span><span>প্ল্যান</span><span>মেম্বার</span><span>মাসিক বিল</span><span>শেষ লগইন</span><span>মেশিন</span><span>স্ট্যাটাস</span><span style="text-align: right">অ্যাকশন</span>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
<div style="display: grid; grid-template-columns: 2.3fr 1.1fr 1fr 0.9fr 1.1fr 1.2fr 1fr 1.3fr 120px; gap: 12px; align-items: center; padding: 11px 20px; border-top: 1px solid {{t.border}}; font-size: 14px">
<span style="display: flex; align-items: center; gap: 10px">
<span class="num" style="width: 36px; height: 36px; border-radius: 10px; background: {{t.chip}}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">{{r.abbr}}</span>
<span style="display: flex; flex-direction: column"><span style="font-weight: 600">{{r.name}}</span><span style="font-size: 12px; color: {{t.muted}}">{{r.owner}}</span></span>
</span>
<span>{{r.city}}</span><span>{{r.plan}}</span><span class="num">{{r.members}}</span><span class="num" style="font-weight: 600">{{r.bill}}</span>
<span style="color: {{t.muted}}">{{r.last}}</span>
<span class="num" style="{{r.devStyle}}">{{r.devices}}</span>
<span><span style="font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; {{r.badge}}">{{r.status}}</span></span>
<span style="display: flex; justify-content: flex-end; gap: 6px">
<button style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.text}}; font-size: 13px; cursor: pointer">দেখুন</button>
<button aria-label="আরও অপশন" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5h.01M12 12h.01M12 19h.01"></path></svg></button>
</span>
</div>
</sc-for>
<div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-top: 1px solid {{t.border}}; font-size: 14px; color: {{t.muted}}">
<span class="num">1–9 of 48</span>
<span>"দেখুন" চাপলে জিমের প্যানেলে সাপোর্ট মোডে ঢুকতে পারবেন</span>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"accent":{"editor":"color","default":"#C6FF3D","options":["#C6FF3D","#FF6B2C","#38BDF8"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? true;
    var accent = this.props.accent ?? '#C6FF3D';
    var t = dark ? { bg: '#0E0F12', surface: '#1A1C21', border: '#2A2D34', chip: '#23262D', text: '#F4F4F5', muted: '#A1A7B0', success: '#4ADE80', warning: '#FBBF24', danger: '#F87171' }
                 : { bg: '#F4F5F1', surface: '#FFFFFF', border: '#E2E4DE', chip: '#EEF0EA', text: '#111214', muted: '#555B64', success: '#15803D', warning: '#B45309', danger: '#B91C1C' };
    function badge(k) {
      var m = dark ? { red: 'background: rgba(248,113,113,0.14); color: #F87171', amber: 'background: rgba(251,191,36,0.14); color: #FBBF24', green: 'background: rgba(74,222,128,0.14); color: #4ADE80', blue: 'background: rgba(56,189,248,0.14); color: #7DD3FC', gray: 'background: rgba(161,167,176,0.16); color: #C3C8CF' }
                   : { red: 'background: #FEE2E2; color: #991B1B', amber: 'background: #FEF3C7; color: #92400E', green: 'background: #DCFCE7; color: #166534', blue: 'background: #E0F2FE; color: #075985', gray: 'background: #E5E7EB; color: #374151' };
      return m[k];
    }
    var tabNames = [['সব', '48', true], ['সক্রিয়', '33'], ['ট্রায়াল', '9'], ['বকেয়া', '4'], ['স্থগিত', '2']];
    var tabs = tabNames.map(function (x) { return { label: x[0], count: x[1], style: x[2] ? 'background: ' + accent + '; color: #0E0F12; font-weight: 600' : 'background: transparent; color: ' + t.muted }; });
    var S = { active: ['সক্রিয়', 'green'], trial: ['ট্রায়াল', 'blue'], due: ['বিল বকেয়া', 'amber'], suspended: ['স্থগিত', 'gray'] };
    var data = [
      ['PH', 'পাওয়ার হাউস জিম', 'মালিক: জাহিদ', 'ঢাকা', 'গ্রোথ', '312', '[দাম]', 'আজ', '2/2', 1, 'active'],
      ['FZ', 'ফিট জোন', 'মালিক: রিয়াদ', 'ঢাকা', 'গ্রোথ', '240', '[দাম]', 'আজ', '1/1', 1, 'active'],
      ['IP', 'আয়রন প্যারাডাইস', 'মালিক: সুমন', 'চট্টগ্রাম', 'ট্রায়াল', '—', '—', 'গতকাল', '0/0', 1, 'trial'],
      ['MF', 'মাসল ফ্যাক্টরি', 'মালিক: তারেক', 'ঢাকা', 'স্টার্টার', '120', '[দাম]', '৩ দিন আগে', '1/2', 0, 'due'],
      ['BS', 'বডি শেপ জিম', 'মালিক: নাজমুল', 'সিলেট', 'স্টার্টার', '85', '[দাম]', 'আজ', '1/1', 1, 'active'],
      ['GG', 'গোল্ডেন জিম', 'মালিক: ফারুক', 'চট্টগ্রাম', 'প্রো', '410', '[দাম]', 'আজ', '3/4', 0, 'active'],
      ['LF', 'লেডিস ফিটনেস', 'মালিক: সাবরিনা', 'ঢাকা', 'গ্রোথ', '160', '[দাম]', 'আজ', '1/1', 1, 'active'],
      ['XF', 'এক্সট্রিম ফিট', 'মালিক: রাকিব', 'খুলনা', 'স্টার্টার', '64', '[দাম]', '২১ দিন আগে', '0/1', 0, 'suspended'],
      ['CF', 'কোর ফিটনেস', 'মালিক: মাহমুদ', 'রাজশাহী', 'ট্রায়াল', '—', '—', 'আজ', '0/0', 1, 'trial']
    ];
    var rows = data.map(function (d) {
      var s = S[d[10]];
      return { abbr: d[0], name: d[1], owner: d[2], city: d[3], plan: d[4], members: d[5], bill: d[6], last: d[7], devices: d[8] + ' অনলাইন', devStyle: 'color: ' + (d[9] ? t.muted : t.danger), status: s[0], badge: badge(s[1]) };
    });
    return { t: t, dark: dark, accent: accent, tabs: tabs, rows: rows };
  }
}
</script>
</body>
</html>
