<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>Member App – Diet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E0F12}
a{color:#C6FF3D}a:hover{color:#E2FF9A}
button{font:inherit}
.num{font-family:'Space Grotesk','Hind Siliguri',sans-serif;font-variant-numeric:tabular-nums}
</style>
</helmet>
<div style="width: 390px; height: 1020px; display: flex; flex-direction: column; background: {{t.bg}}; color: {{t.text}}; font-family: 'Hind Siliguri', 'Space Grotesk', system-ui, sans-serif; overflow: hidden">
<main style="display: flex; flex-direction: column; gap: 16px; padding: 20px; flex-grow: 1">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 22px">ডায়েট</h1>
<span style="font-size: 13px; color: {{t.muted}}">ট্রেইনারের প্ল্যান: ওজন কমানো · 1,800 kcal</span>
</div>

<div style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 18px; background: {{t.surface}}; border: 1px solid {{t.border}}">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<span style="font-size: 14px; color: {{t.muted}}">আজ খেয়েছেন</span>
<span class="num" style="font-size: 14px; color: {{t.muted}}">560 kcal বাকি</span>
</div>
<div style="display: flex; align-items: baseline; gap: 6px"><span class="num" style="font-size: 38px; font-weight: 700; line-height: 1; color: {{t.accentText}}">1,240</span><span class="num" style="font-size: 15px; color: {{t.muted}}">/ 1,800 kcal</span></div>
<div style="height: 10px; border-radius: 5px; background: {{t.chip}}"><div style="width: 69%; height: 10px; border-radius: 5px; background: {{accent}}"></div></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{macros}}" as="m" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: {{t.muted}}">{{m.name}}</span>
<span class="num" style="font-size: 15px; font-weight: 600">{{m.val}}</span>
<div style="height: 6px; border-radius: 3px; background: {{t.chip}}"><div style="height: 6px; border-radius: 3px; {{m.bar}}"></div></div>
</div>
</sc-for>
</div>
</div>

<button style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px; border: none; background: {{accent}}; color: #0E0F12; text-align: left; cursor: pointer">
<span style="width: 48px; height: 48px; border-radius: 14px; background: rgba(14,15,18,0.12); display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg>
</span>
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 700">খাবারের ছবি তুলুন</span>
<span style="font-size: 13px">এআই ক্যালোরি ও প্রোটিন আন্দাজ করবে</span>
</span>
</button>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 16px; font-weight: 700">আজকের খাবার</span>
<sc-for list="{{meals}}" as="m" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.border}}">
<div style="width: 52px; height: 52px; border-radius: 12px; background: {{t.chip}}; display: flex; align-items: center; justify-content: center; font-size: 11px; color: {{t.muted}}">ছবি</div>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-size: 12px; color: {{t.muted}}">{{m.time}}</span>
<span style="font-size: 15px; font-weight: 600">{{m.name}}</span>
<span class="num" style="font-size: 12px; color: {{t.muted}}">{{m.macro}}</span>
</div>
<span class="num" style="font-size: 15px; font-weight: 700">{{m.kcal}}</span>
</div>
</sc-for>
</div>

<p style="margin: 0; font-size: 12px; color: {{t.muted}}; line-height: 1.5">এআই-এর হিসাব আনুমানিক। সঠিক ডায়েটের জন্য ট্রেইনার বা পুষ্টিবিদের পরামর্শ নিন।</p>
</main>

<nav style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 6px 18px 6px; background: {{t.surface}}; border-top: 1px solid {{t.border}}">
<sc-for list="{{tabs}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; {{n.style}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>
<span style="font-size: 11px">{{n.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"accent":{"editor":"color","default":"#C6FF3D","options":["#C6FF3D","#FF6B2C","#38BDF8"]},"$preview":{"width":390,"height":1020}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? true;
    var accent = this.props.accent ?? '#C6FF3D';
    var t = dark ? { bg: '#0E0F12', surface: '#1A1C21', border: '#2A2D34', chip: '#23262D', text: '#F4F4F5', muted: '#A1A7B0', accentText: accent }
                 : { bg: '#F4F5F1', surface: '#FFFFFF', border: '#E2E4DE', chip: '#EEF0EA', text: '#111214', muted: '#555B64', accentText: '#3F6212' };
    var active = 'diet';
    var list = [
      ['home', 'হোম', 'M-Home.dc.html', 'm3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10'],
      ['workout', 'ওয়ার্কআউট', 'M-Workout.dc.html', 'M6.5 6.5h11M6.5 17.5h11M3 9v6M21 9v6M6 7v10M18 7v10'],
      ['diet', 'ডায়েট', 'M-Diet.dc.html', 'M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2M7 2v20M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zM21 15v7'],
      ['progress', 'প্রোগ্রেস', 'M-Progress.dc.html', 'M3 3v18h18M7 14l4-4 4 4 5-6'],
      ['membership', 'মেম্বারশিপ', 'M-Membership.dc.html', 'M2 6h20v14H2zM2 10h20M16 15h2']
    ];
    var tabs = list.map(function (x) { var on = x[0] === active; return { label: x[1], href: x[2], d: x[3], style: 'color: ' + (on ? t.accentText : t.muted) + (on ? '; font-weight: 600' : '') }; });
    return {
      t: t, accent: accent, tabs: tabs,
      macros: [
        { name: 'প্রোটিন', val: '62 / 110 g', bar: 'width: 56%; background: #38BDF8' },
        { name: 'কার্বস', val: '150 / 180 g', bar: 'width: 83%; background: #FF6B2C' },
        { name: 'ফ্যাট', val: '38 / 55 g', bar: 'width: 69%; background: #FBBF24' }
      ],
      meals: [
        { time: 'সকাল 8:00', name: 'ডিম সেদ্ধ ও রুটি', macro: 'প্রোটিন 18g · কার্বস 40g', kcal: '320' },
        { time: 'দুপুর 1:30', name: 'ভাত, মুরগি ও ডাল', macro: 'প্রোটিন 32g · কার্বস 85g', kcal: '640' },
        { time: 'বিকাল 5:00', name: 'প্রোটিন শেক', macro: 'প্রোটিন 24g · কার্বস 8g', kcal: '140' },
        { time: 'বিকাল 6:30', name: 'ফল (কলা ও আপেল)', macro: 'প্রোটিন 1g · কার্বস 34g', kcal: '140' }
      ]
    };
  }
}
</script>
</body>
</html>
