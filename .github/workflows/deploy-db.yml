name: Deploy database (gymnode-dev)

# Applies new files from supabase/migrations/ to the online Supabase project.
# Run it by hand: GitHub → Actions → "Deploy database (gymnode-dev)" → Run workflow.
# It never runs supabase/seed.sql (local demo data only).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show which migrations would be applied"
        type: boolean
        default: false

concurrency:
  group: deploy-db-dev
  cancel-in-progress: false

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    env:
      # Project ref is not secret (it is part of the public project URL).
      PROJECT_REF: dsqtjvpekxfagcainyqv
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check that the secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD under Settings → Secrets and variables → Actions (see docs/DEPLOY.md)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm exec supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
          else
            pnpm exec supabase db push --password "$SUPABASE_DB_PASSWORD"
          fi
